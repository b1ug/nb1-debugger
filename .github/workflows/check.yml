name: Debugger source and bundle
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Node ${{ matrix.node }} / verified bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:syntax
      - run: npm run check:locales
      - run: npm run build
      - run: npm run check:dist
      - run: npm run check:nightlab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nb1-embedded-workbench-node-${{ matrix.node }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
